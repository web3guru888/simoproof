[package]
name    = "simoproof-prover"
version = "1.0.0"
edition = "2021"

# risc0-build discovers guest packages via this metadata section.
# The "methods" list contains paths relative to this Cargo.toml.
[package.metadata.risc0]
methods = ["../simoproof-guest"]

[dependencies]
risc0-zkvm  = { version = "3.0", features = ["std"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
anyhow      = "1.0"
clap        = { version = "4.0", features = ["derive"] }
hex         = "0.4"

[build-dependencies]
risc0-build = { version = "3.0" }
